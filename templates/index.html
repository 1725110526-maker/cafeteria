<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria UTEC - Sistema Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="fa-solid fa-mug-hot me-2"></i> Cafetería UTEC - Panel Web</span>
        </div>
    </header>

    <div class="container pb-5">
        <!-- Estadísticas -->
        <div class="row g-3 mb-4">
            <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-4 border-primary"><h6>Total Atendidos</h6><h3 id="statTotal">0</h3></div></div>
            <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-4 border-danger"><h6>Prioritarios</h6><h3 id="statPrioritarios">0</h3></div></div>
            <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-4 border-secondary"><h6>Normales</h6><h3 id="statNormales">0</h3></div></div>
            <div class="col-md-3"><div class="card p-3 shadow-sm border-start border-4 border-warning"><h6>Tiempo Acumulado</h6><h3><span id="statTiempo">0</span> min</h3></div></div>
        </div>

        <div class="row g-4">
            <!-- Formulario y Acciones -->
            <div class="col-lg-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white"><strong>1. Registrar Pedido</strong></div>
                    <div class="card-body">
                        <form id="formPedido">
                            <div class="mb-2"><label class="form-label small">Cliente</label><input type="text" class="form-control" id="cliente" required></div>
                            <div class="mb-2"><label class="form-label small">Producto</label><input type="text" class="form-control" id="producto" required></div>
                            <div class="row g-2 mb-2">
                                <div class="col-6"><label class="form-label small">Cantidad</label><input type="number" class="form-control" id="cantidad" value="1" min="1" required></div>
                                <div class="col-6"><label class="form-label small">Tiempo (min)</label><input type="number" class="form-control" id="tiempo" value="5" min="1" required></div>
                            </div>
                            <div class="mb-3"><label class="form-label small">Tipo</label>
                                <select class="form-select" id="tipo">
                                    <option value="normal">Normal</option>
                                    <option value="prioritario">Prioritario (Clases próximas)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold">Registrar</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white"><strong>Controles de Atención</strong></div>
                    <div class="card-body d-grid gap-2">
                        <button class="btn btn-warning fw-bold" onclick="prepararSiguiente()">2. Preparar Siguiente</button>
                        <button class="btn btn-outline-primary" onclick="consultarSiguiente()">3. Consultar Siguiente</button>
                    </div>
                </div>
            </div>

            <!-- Visualización de Filas -->
            <div class="col-lg-8">
                <div id="alerta" class="alert d-none"></div>

                <div class="card shadow-sm mb-4 border-danger">
                    <div class="card-header bg-danger text-white"><strong>🚨 Fila Prioritaria</strong></div>
                    <div class="card-body p-0">
                        <table class="table mb-0 align-middle">
                            <thead><tr><th>#</th><th>Cliente</th><th>Producto</th><th>Cant.</th><th>Tiempo</th><th class="text-end">Acción</th></tr></thead>
                            <tbody id="tablaPrioritaria"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card shadow-sm border-secondary">
                    <div class="card-header bg-secondary text-white"><strong>📋 Fila Normal</strong></div>
                    <div class="card-body p-0">
                        <table class="table mb-0 align-middle">
                            <thead><tr><th>#</th><th>Cliente</th><th>Producto</th><th>Cant.</th><th>Tiempo</th><th class="text-end">Acción</th></tr></thead>
                            <tbody id="tablaNormal"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function cargarEstado() {
            const res = await fetch('/api/estado');
            const data = await res.json();
            
            // Estadísticas
            document.getElementById('statTotal').textContent = data.estadisticas.total_atendidos;
            document.getElementById('statPrioritarios').textContent = data.estadisticas.prioritarios_atendidos;
            document.getElementById('statNormales').textContent = data.estadisticas.normales_atendidos;
            document.getElementById('statTiempo').textContent = data.estadisticas.tiempo_total;

            // Tabla Prioritaria
            const tbodyP = document.getElementById('tablaPrioritaria');
            tbodyP.innerHTML = data.cola_prioritaria.length ? '' : '<tr><td colspan="6" class="text-center text-muted py-3">Vacío</td></tr>';
            data.cola_prioritaria.forEach(p => {
                tbodyP.innerHTML += `<tr><td><strong>#${p.numero}</strong></td><td>${p.cliente}</td><td>${p.producto}</td><td>${p.cantidad}</td><td><span class="badge bg-danger">${p.tiempo}m</span></td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="cancelar(${p.numero})">Cancelar</button></td></tr>`;
            });

            // Tabla Normal
            const tbodyN = document.getElementById('tablaNormal');
            tbodyN.innerHTML = data.cola_normal.length ? '' : '<tr><td colspan="6" class="text-center text-muted py-3">Vacío</td></tr>';
            data.cola_normal.forEach(p => {
                tbodyN.innerHTML += `<tr><td><strong>#${p.numero}</strong></td><td>${p.cliente}</td><td>${p.producto}</td><td>${p.cantidad}</td><td><span class="badge bg-secondary">${p.tiempo}m</span></td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="cancelar(${p.numero})">Cancelar</button></td></tr>`;
            });
        }

        document.getElementById('formPedido').addEventListener('submit', async function(e) {
            e.preventDefault();
            const datos = {
                cliente: document.getElementById('cliente').value,
                producto: document.getElementById('producto').value,
                cantidad: document.getElementById('cantidad').value,
                tiempo: document.getElementById('tiempo').value,
                tipo: document.getElementById('tipo').value
            };

            const res = await fetch('/api/registrar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(datos)
            });
            const r = await res.json();
            if(r.success) {
                this.reset();
                cargarEstado();
            }
        });

        async function prepararSiguiente() {
            const res = await fetch('/api/preparar', {method: 'POST'});
            const r = await res.json();
            const alerta = document.getElementById('alerta');
            alerta.classList.remove('d-none');
            if(r.success) {
                alerta.className = "alert alert-success";
                alerta.innerHTML = `✅ Preparando Pedido #${r.pedido.numero} de ${r.pedido.cliente} (${r.pedido.producto})`;
                cargarEstado();
            } else {
                alerta.className = "alert alert-warning";
                alerta.innerHTML = r.message;
            }
        }

        async function consultarSiguiente() {
            const res = await fetch('/api/siguiente');
            const r = await res.json();
            const alerta = document.getElementById('alerta');
            alerta.classList.remove('d-none');
            if(r.success) {
                alerta.className = "alert alert-info";
                alerta.innerHTML = `👀 Siguiente en fila (${r.fila}): Pedido #${r.pedido.numero} - ${r.pedido.cliente} (${r.pedido.producto})`;
            } else {
                alerta.className = "alert-secondary";
                alerta.innerHTML = r.message;
            }
        }

        async function cancelar(numero) {
            const res = await fetch(`/api/cancelar/${numero}`, {method: 'DELETE'});
            const r = await res.json();
            if(r.success) cargarEstado();
        }

        cargarEstado();
    </script>
</body>
</html>
